name: Build (Android + Windows + Linux)

# Exports the game with the barichello/godot-ci image, which ships the Godot 3.5.2
# export templates and the Android SDK. Run it from the Actions tab or push a branch.
# NOTE: written without being able to run it in the authoring sandbox - if a step
# fails, the log will point at the path/setting to adjust.

on:
  workflow_dispatch:
  push:
    branches: [main, "ccr-*"]

env:
  GODOT_VERSION: 3.5.2

jobs:
  export:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:3.5.2
    steps:
      - uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/templates
          mv /root/.local/share/godot/templates/${GODOT_VERSION}.stable ~/.local/share/godot/templates/${GODOT_VERSION}.stable

      - name: Import assets
        run: godot --path . --editor --quit || true

      - name: Run smoke test
        run: |
          mkdir -p tests/out
          xvfb-run -a godot --path . --audio-driver Dummy -s res://tests/smoke_test.gd -- --no-capture --mobile

      - name: Configure Android signing (debug keystore)
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-3.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=2]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          SETTINGS
          sed -i 's/^          //' ~/.config/godot/editor_settings-3.tres

      - name: Export
        run: |
          mkdir -p build/android build/windows build/linux
          godot --path . --export-debug "Android" build/android/StormIsland.apk
          godot --path . --export "Windows Desktop" build/windows/StormIsland.exe
          godot --path . --export "Linux/X11" build/linux/StormIsland.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: StormIsland-builds
          path: build/
